apiVersion: v1
kind: Service
metadata:
  name: bl-keycloak
  namespace: bitloops
spec:
  selector:
    app: bl-keycloak
  ports:
    - name: http
      protocol: TCP
      port: 8090
      targetPort: 8080
    - name: management
      protocol: TCP
      port: 9000
      targetPort: 9000
  type: LoadBalancer
