name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go telemetry consumer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry-consumer

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: telemetry-consumer/go.mod
          cache-dependency-path: telemetry-consumer/go.sum
      - name: Verify Go modules
        run: go mod verify
      - name: Test Go telemetry consumer
        run: go test ./...
      - name: Build Go telemetry consumer
        run: go build ./...
      - name: Build telemetry consumer image
        run: docker build --tag bitloops-telemetry-consumer:ci .

  node:
    name: Node workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bitloops_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d bitloops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build backend
        run: pnpm --dir backend run build
      - name: Lint backend
        run: pnpm --dir backend run lint
      - name: Test backend
        run: pnpm --dir backend run test
      - name: Test backend PostgreSQL integration
        run: pnpm --dir backend run test:integration
        env:
          PG_DATABASE: bitloops_test
          PG_USER: user
          PG_PASSWORD: postgres
      - name: Lint frontend
        run: pnpm --dir frontend run lint
      - name: Build frontend
        run: pnpm --dir frontend run build
      - name: Test frontend behaviour
        run: pnpm --dir frontend/tests run test
